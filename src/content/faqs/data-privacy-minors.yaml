q: How is my child's personal data handled?
a: 'Students under 18 apply through a parent or guardian, who gives consent. We collect only what is needed to reply, use unticked consent boxes, and do not track or advertise to children. If you do not join, we delete enquiry details 12 months after our last contact. Student records are kept for the length of the program plus two years, so certificates can be verified, then deleted. You can ask us to see, correct or delete your data at any time, and we act on it within 30 days. Our grievance contact is Hussain, at Hussain@neuronetwrks.com, who replies within 7 working days.'
group: privacy
