q: How much time does it take each week?
a: The three-year programs run 4 hours a week for 52 weeks a year (208 hours a year, 624 in total). The one-year AI Foundations course runs 2 guided hours a week for 52 weeks (104 hours), or 4 hours a week to finish in 26 weeks, plus 10 to 15 minutes of homework after each lecture.
