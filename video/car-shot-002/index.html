<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Video 002 — six-year-old car</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg: #ffffff;
        --skin: #fcc09b;
        --ink: #111111;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      /* Camera: only the pan is tweened here. */
      #camera {
        position: absolute;
        inset: 0;
        will-change: transform;
      }
      /* Art box: the 2000x1116 plate scaled ~6% over the frame so the pan never shows an edge. */
      #art {
        position: absolute;
        width: 2052px;
        height: 1145px;
        left: -66px;
        top: -32px;
      }
      /* Four cut-out layers of the same plate, stacked in draw order. */
      .layer {
        position: absolute;
        inset: 0;
        will-change: transform;
      }
      .layer img {
        display: block;
        width: 100%;
        height: 100%;
      }
      #layer-shadow { z-index: 1; }
      #layer-body   { z-index: 2; }
      #layer-wheels { z-index: 3; }
      #layer-man    { z-index: 4; }
      /* Eyelids live inside the man layer so they follow his lean. */
      .eye {
        position: absolute;
        overflow: visible;
        transform: rotate(-6.5deg);
      }
      #eye-l {
        left: 55.25%;
        top: 17.65%;
        width: 2.4%;
        height: 4.3%;
      }
      #eye-r {
        left: 58.3%;
        top: 17.15%;
        width: 2.15%;
        height: 4.05%;
      }
      .lid {
        position: absolute;
        inset: 0;
        background: var(--skin);
        border-radius: 50%;
        border-bottom: 4px solid var(--ink);
        transform-origin: 50% 0%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="3.5"
      data-fps="24"
      data-width="1920"
      data-height="1080"
    >
      <section id="shot" class="clip" data-start="0" data-duration="3.5" data-track-index="0">
        <div id="camera">
          <div id="art">
            <div class="layer" id="layer-shadow"><img src="assets/layers/shadow.png" alt="" /></div>
            <div class="layer" id="layer-body"><img src="assets/layers/body.png" alt="" /></div>
            <div class="layer" id="layer-wheels"><img src="assets/layers/wheels.png" alt="" /></div>
            <div class="layer" id="layer-man">
              <img src="assets/layers/man.png" alt="Cartoon man in a navy blazer leaning on a dented old blue sedan" />
              <div class="eye" id="eye-l"><div class="lid" id="lid-l"></div></div>
              <div class="eye" id="eye-r"><div class="lid" id="lid-r"></div></div>
            </div>
          </div>
        </div>
      </section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const feet = "61.75% 71%"; // his shoe line in the art box: the pivot for the lean

      // Eyelids start open (scaleY 0) and only close during the blink.
      tl.set(["#lid-l", "#lid-r"], { scaleY: 0 }, 0);

      // 1. He leans his weight back into the car (pivot at his feet).
      tl.fromTo(
        "#layer-man",
        { y: 0, rotation: 0, transformOrigin: feet },
        { y: 0, rotation: -1.8, duration: 0.24, ease: "power2.in" },
        0
      );

      // 2. The car body dips on its suspension under him, wheels and shadow stay on the ground.
      tl.fromTo("#layer-body", { y: 0 }, { y: 22, duration: 0.26, ease: "power2.in" }, 0.08);

      // 3. Then it springs back up once, overshooting a touch, and he settles with it.
      tl.to("#layer-body", { y: 0, duration: 1.2, ease: "elastic.out(1.2, 0.45)" }, 0.34);
      tl.to(
        "#layer-man",
        { rotation: 0, duration: 1.2, ease: "elastic.out(1.2, 0.45)" },
        0.34
      );

      // 4. Idle: a barely-there bob of the body while he holds the pose.
      tl.to("#layer-body", { y: 2, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 3 }, 1.56);

      // 5. Camera pan, left to right, across the whole shot.
      tl.fromTo("#camera", { x: 34 }, { x: -34, duration: 3.5, ease: "sine.inOut" }, 0);

      // 6. One slow, content blink at 2.1s: close quickly, hold, open slowly.
      tl.fromTo(
        ["#lid-l", "#lid-r"],
        { scaleY: 0 },
        { scaleY: 1, duration: 0.16, ease: "power2.in" },
        2.1
      );
      tl.to(["#lid-l", "#lid-r"], { scaleY: 0, duration: 0.3, ease: "power2.out" }, 2.4);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
